spring.application.name=spring-transaction-engine
server.port=8080
# Prettier JSON
spring.jackson.serialization.indent-output=true
# Baza danych PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/transactional_db
spring.datasource.username=engine_user
spring.datasource.password=engine_password
# Logowanie zapytań SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Automatyczne tworzenie tabel
spring.jpa.hibernate.ddl-auto=update
# Podpięcie maila pod Spring Mail (do konfiguracji)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=username
# spring.mail.password=password/token
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# Konfiguracja Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092
# Konfiguracja kafki (odbieranie wiadomości)
spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Konfiguracja kafki (wysyłanie wiadomości)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer